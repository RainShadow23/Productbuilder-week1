<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 문의</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
</head>

<body class="contact-page" data-i18n-title="contact.title">
    <button id="theme-toggle" data-i18n="theme.toggle">테마 변경</button>
    <div class="container">
        <h1 data-i18n="contact.title">제휴 문의</h1>
        <p data-i18n="contact.subtitle">제휴 파트너십에 관한 문의는 아래 양식을 이용해 주세요.</p>
        <form action="https://formspree.io/f/meeejlwd" method="POST">
            <div class="form-group">
                <label for="name" data-i18n="contact.name">이름:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email" data-i18n="contact.email">이메일:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message" data-i18n="contact.message">메시지:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" data-i18n="contact.submit">문의 보내기</button>
        </form>
        <p><a href="index.html" data-i18n="home.link">홈으로 돌아가기</a></p>
    </div>
    <script src="main.js"></script>
</body>

</html>
