    <style>
        /* Home Specific Styles */
        .ad-banner {
            width: 100%;
            height: 100px;
            background-color: #f1f3f5;
            border: 1px dashed #ccc;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        body.dark .ad-banner {
            background-color: #2c2e33;
            border-color: #495057;
        }

        .main-card-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 2rem;
        }

        .main-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-color: var(--bg-color);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .main-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: var(--primary-color);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Stock Theme Highlight */
        .stock-card:hover .card-title {
            color: #e74c3c;
        }

        /* Coin Theme Highlight */
        .coin-card:hover .card-title {
            color: #f39c12;
        }

        .sub-link {
            display: block;
            margin-top: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-decoration: underline;
            opacity: 0.7;
        }

        .sub-link:hover {
            opacity: 1;
            color: var(--text-color);
        }

        .footer {
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            margin: 0 5px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .main-card-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
